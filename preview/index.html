:root {
  color-scheme: dark;
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: #f1f3e9;
  background: #141714;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

* {
  box-sizing: border-box;
}

body,
h1,
p {
  margin: 0;
}

::selection {
  color: #141714;
  background: #ffab8d;
}

.page {
  display: flex;
  flex-direction: column;
  width: min(1160px, calc(100% - 96px));
  min-height: 100vh;
  min-height: 100svh;
  margin-inline: auto;
}

.header,
.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.header {
  min-height: 100px;
  border-bottom: 1px solid #343d34;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-size: 26px;
  font-weight: 750;
  letter-spacing: -1.4px;
}

.brand img {
  display: block;
  width: 36px;
  height: 36px;
  border: 1px solid #343d34;
  border-radius: 9px;
}

.brand-dot {
  color: #ffab8d;
}

.header-note {
  color: #adb4aa;
  font-size: 13px;
}

main {
  display: flex;
  align-items: center;
  flex: 1;
  padding-block: 90px 104px;
}

.notice {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 290px;
  align-items: center;
  gap: 60px;
  width: 100%;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 9px 12px;
  border: 1px solid #58483a;
  border-radius: 6px;
  color: #ecc782;
  background: #24231d;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 1px;
}

.status > span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

h1 {
  margin-top: 26px;
  font-size: clamp(42px, 5.6vw, 72px);
  font-weight: 750;
  line-height: 1.08;
  letter-spacing: -0.055em;
}

h1 > span {
  color: #ffab8d;
}

.description {
  max-width: 440px;
  margin-top: 26px;
  color: #adb4aa;
  font-size: 17px;
  line-height: 1.7;
  text-wrap: pretty;
}

.return-note {
  margin-top: 25px;
  font-size: 15px;
  font-weight: 600;
}

.portrait {
  padding-top: 16px;
}

.portrait-frame {
  position: relative;
  padding: 12px;
  border: 1px solid #44493e;
  border-radius: 24px;
  background: #242a23;
  transform: rotate(5deg);
}

.portrait-frame > img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 14px;
  filter: saturate(0.78);
}

.pause {
  position: absolute;
  right: -17px;
  bottom: -17px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  width: 75px;
  height: 75px;
  border: 7px solid #141714;
  border-radius: 21px;
  background: #ffab8d;
  transform: rotate(-12deg);
}

.pause > span {
  width: 7px;
  height: 24px;
  border-radius: 2px;
  background: #44251f;
}

.portrait-caption {
  display: block;
  margin-top: 31px;
  color: #adb4aa;
  font-size: 12px;
  text-align: center;
}

.footer {
  min-height: 76px;
  padding-block: 20px;
  border-top: 1px solid #343d34;
  color: #adb4aa;
  font-size: 12px;
}

@media (max-width: 900px) {
  .page {
    width: calc(100% - 64px);
  }

  .notice {
    grid-template-columns: minmax(0, 1fr) 215px;
    gap: 35px;
  }

  h1 {
    font-size: clamp(42px, 5.8vw, 56px);
  }

  .description {
    font-size: 16px;
  }
}

@media (max-width: 650px) {
  .page {
    width: calc(100% - 40px);
  }

  .header {
    min-height: 78px;
  }

  .brand {
    gap: 9px;
    font-size: 23px;
  }

  .brand img {
    width: 32px;
    height: 32px;
  }

  .header-note {
    font-size: 12px;
  }

  main {
    padding-block: 49px 54px;
  }

  .notice {
    grid-template-columns: 1fr;
    gap: 36px;
  }

  h1 {
    margin-top: 23px;
    font-size: clamp(36px, 9.4vw, 58px);
  }

  .description {
    max-width: 370px;
    margin-top: 22px;
  }

  .return-note {
    margin-top: 19px;
  }

  .portrait {
    width: 170px;
    margin-inline: auto;
    padding-top: 0;
  }

  .portrait-frame {
    padding: 8px;
    border-radius: 18px;
  }

  .portrait-frame > img {
    border-radius: 10px;
  }

  .pause {
    right: -13px;
    bottom: -13px;
    gap: 7px;
    width: 57px;
    height: 57px;
    border-width: 5px;
    border-radius: 16px;
  }

  .pause > span {
    width: 5px;
    height: 18px;
  }

  .portrait-caption {
    margin-top: 21px;
    font-size: 11px;
  }

  .footer {
    min-height: 66px;
  }
}
